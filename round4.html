<!DOCTYPE html>
<html lang="kk" translate="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="google" content="notranslate">
<title>IV тур — Уақыт машинасы</title>

<style>
*{box-sizing:border-box}
:root{--gold:#ffda88;--cream:#fff3d9}
body{
  margin:0;min-height:100vh;
  font-family:"Segoe UI",Arial,sans-serif;
  color:var(--cream);
  background:
    linear-gradient(#04102588,#041025dd),
    url("stage.png") center/cover fixed no-repeat;
  background-color:#06152c
}
button{font:inherit;cursor:pointer}
button:disabled{opacity:.4;cursor:default}
button:focus-visible,a:focus-visible{
  outline:3px solid white;outline-offset:4px
}
main{width:min(1250px,94%);margin:auto;padding:22px 0}
header{
  display:flex;justify-content:space-between;align-items:center;
  flex-wrap:wrap;gap:15px;padding-bottom:18px;
  border-bottom:1px solid #cda46377
}
a{color:var(--gold)}
.brand{font-weight:800;text-decoration:none;letter-spacing:2px}
h1{
  margin:0;font-family:Georgia,serif;
  color:var(--gold);font-size:clamp(24px,3.4vw,40px)
}
.tools{display:flex;gap:8px;align-items:center}
.primary,.ghost{
  padding:12px 16px;border-radius:11px;font-weight:700
}
.primary{
  color:#3b2009;border:1px solid #ffecb2;
  background:linear-gradient(135deg,#ffe9af,#e2a33c)
}
.ghost{
  color:#f8d99e;border:1px solid #c29b6088;background:#081a33ee
}
.turn{
  width:fit-content;max-width:100%;margin:20px auto;
  padding:10px 22px;text-align:center;
  border:1px solid #ffda88;border-radius:30px;
  background:#07182eef;color:#ffda88;font-weight:800
}
.progress-track{
  display:grid;grid-template-columns:repeat(20,1fr);
  gap:6px;margin-bottom:20px
}
.progress-dot{
  height:9px;border-radius:8px;background:#69799166
}
.progress-dot.done{background:#bb9c62}
.progress-dot.current{
  background:#83ecff;box-shadow:0 0 12px #83ecff66
}
.panel{
  padding:27px;border:1px solid #d6af67;
  border-radius:22px;background:linear-gradient(135deg,#142c49f5,#07142af5);
  box-shadow:0 15px 40px #0005
}
.panel-head{
  display:flex;justify-content:space-between;
  align-items:center;gap:15px;flex-wrap:wrap
}
.subject{
  padding:8px 13px;border:1px solid #b4935d;
  border-radius:25px;color:#ffe1a7;font-size:13px
}
.timer{
  display:flex;gap:15px;align-items:center;
  padding:10px 17px;border:1px solid #8bc1ec;
  border-radius:14px;background:#07182b
}
.timer b{
  font-size:40px;color:#c3eaff;font-variant-numeric:tabular-nums
}
.timer small{display:block;color:#c8bc9e;font-size:11px}
.timer strong{font-size:20px;color:#ffdf9f}
h2{
  text-align:center;font-size:clamp(23px,3vw,34px);
  line-height:1.5;color:#fff0cf;margin:23px 0 10px
}
.help{
  text-align:center;color:#cebea3;font-size:13px;line-height:1.8
}
.timeline{
  display:grid;gap:13px;margin-top:25px
}
.slot{
  position:relative;min-height:100px;
  display:flex;align-items:center;justify-content:center;
  text-align:center;padding:30px 14px 15px;
  border:1px dashed #78c4de;border-radius:15px;
  background:#061a2dd9;color:#9caec0;
  font-size:clamp(15px,1.7vw,22px);line-height:1.5
}
.slot small{
  position:absolute;left:12px;top:8px;
  color:#85d9f2;font-size:10px;letter-spacing:1px
}
.slot.filled{
  border-style:solid;color:#fff0d3;
  background:linear-gradient(135deg,#1c465c,#10243c);
  box-shadow:inset 0 1px 0 #ffffff15
}
.slot.correct{
  border-color:#a9d48b;background:#254633;color:#efffe0
}
.choices{
  display:grid;gap:12px;margin-top:24px
}
.choice{
  padding:18px 12px;min-height:82px;
  border:1px solid #c4a26a;border-radius:14px;
  background:linear-gradient(135deg,#2d3d52,#102138);
  color:#ffe9bd;line-height:1.5;
  font-size:clamp(15px,1.7vw,21px);font-weight:700;
  box-shadow:0 5px 12px #0004
}
.choice.used{opacity:.25}
.actions,.claim{
  display:flex;justify-content:center;flex-wrap:wrap;
  gap:10px;margin-top:22px
}
.proof{
  padding:18px;margin-top:20px;border-radius:13px;
  border:1px solid #b8ce94;background:#263d2ddd;
  line-height:1.8;color:#e8ffda
}
.proof strong{display:block;margin-bottom:8px;color:#ecffda}
.banner{
  margin-top:20px;padding:16px 20px;
  border:1px solid #d3ae6966;border-radius:14px;
  background:#0c2039f0;color:#f2dcba;
  line-height:1.8;text-align:center
}
.banner.success{
  background:#3c3119ed;border-color:#ffd67b;color:#ffedb3
}
.teams{
  display:grid;grid-template-columns:repeat(3,1fr);
  gap:15px;margin-top:22px
}
.team{
  --accent:#ffd474;
  padding:19px;border:1px solid var(--accent);
  border-radius:17px;background:#0b1e36f5
}
.team:nth-child(2){--accent:#72e5ff}
.team:nth-child(3){--accent:#d6a1ff}
.team.active{
  box-shadow:0 0 24px color-mix(
    in srgb,var(--accent) 35%,transparent
  )
}
.team h3{color:var(--accent);font-size:20px;margin:0 0 10px}
.team p{font-size:12px;color:#d6c8b1;line-height:1.8;margin:7px 0}
.team strong{font-size:24px}
footer{
  display:flex;justify-content:space-between;align-items:center;
  flex-wrap:wrap;gap:12px;margin-top:23px;
  font-size:12px;color:#d0bea0
}
dialog{
  width:min(850px,94vw);padding:25px;
  color:#fff0d0;background:#091b33;
  border:1px solid #e1b96f;border-radius:20px;line-height:1.8
}
dialog::backdrop{background:#000b;backdrop-filter:blur(5px)}
dialog h2{color:var(--gold);margin-top:0}
.table-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;margin:20px 0;font-size:13px}
th,td{
  padding:11px 9px;border:1px solid #c8ab7155;
  text-align:center;white-space:nowrap
}
th{background:#19334f;color:#ffdfa1}
#warning{
  padding:13px;background:#663520;color:#fff0c8;
  border-radius:10px;margin-bottom:15px
}
[hidden]{display:none!important}
@media(max-width:650px){
  header{justify-content:center;text-align:center}
  h1{width:100%}
  .panel{padding:17px}
  .timeline,.choices{gap:8px}
  .slot{font-size:13px;padding:27px 8px 10px;min-height:90px}
  .choice{font-size:13px;padding:13px 8px;min-height:80px}
  .teams{gap:7px}
  .team{padding:13px 8px;text-align:center}
  .team h3{font-size:12px}
  .team strong{font-size:19px}
  footer{justify-content:center}
}
</style>
</head>

<body>
<main>
  <div id="warning" role="status" hidden></div>

  <header>
    <a class="brand" href="index.html">ОЙ БӘЙГЕСІ</a>
    <h1>IV ТУР · УАҚЫТ МАШИНАСЫ</h1>
    <div class="tools">
      <button class="ghost" id="sound" aria-pressed="false">♫ Өшірулі</button>
      <button class="ghost" id="fullscreen" aria-label="Толық экран">⛶</button>
    </div>
  </header>

  <div class="turn" id="turn"></div>
  <div class="progress-track" id="progress"></div>

  <section class="panel">
    <div class="panel-head">
      <span class="subject" id="subject"></span>
      <div class="timer">
        <b id="seconds">20</b>
        <div>
          <small>секунд</small>
          <strong id="possible">10 ұпай</strong>
        </div>
      </div>
    </div>

    <h2 id="title"></h2>

    <p class="help" id="help">
      Бөліктерді дұрыс ретімен басыңыз.
      Таңдалған бөлік жоғарыдағы орынға орналасады.
    </p>

    <div class="claim" id="claim" hidden>
      <button class="ghost" data-team="0">Импульс</button>
      <button class="ghost" data-team="1">Квант</button>
      <button class="ghost" data-team="2">Нова</button>
    </div>

    <div class="timeline" id="timeline"></div>
    <div class="choices" id="choices"></div>

    <div class="actions">
      <button class="primary" id="start">▶ Тапсырманы ашу</button>
      <button class="ghost" id="pause" disabled>Ⅱ Кідірту</button>
      <button class="ghost" id="back" disabled>↶ Соңғысын қайтару</button>
      <button class="ghost" id="clear" disabled>Ретті тазалау</button>
      <button class="primary" id="check" disabled>Ретін тексеру</button>
      <button class="ghost" id="skip">Өткізу</button>
      <button class="primary" id="next" hidden>Келесі тапсырма →</button>
    </div>

    <div class="proof" id="proof" hidden></div>
  </section>

  <div class="banner" id="banner" role="status" aria-live="polite"></div>

  <section class="teams">
    <article class="team" id="team0">
      <h3>ϟ ИМПУЛЬС</h3>
      <p id="details0"></p>
      <strong id="total0"></strong>
    </article>
    <article class="team" id="team1">
      <h3>⚛ КВАНТ</h3>
      <p id="details1"></p>
      <strong id="total1"></strong>
    </article>
    <article class="team" id="team2">
      <h3>✦ НОВА</h3>
      <p id="details2"></p>
      <strong id="total2"></strong>
    </article>
  </section>

  <footer>
    <a href="round3.html">← III тур</a>
    <span id="counter"></span>
    <button class="ghost" id="results">Ұпай кестесі</button>
    <button class="ghost" id="reset">IV турды қайта бастау</button>
  </footer>
</main>

<dialog id="resultsDialog">
  <h2 id="resultsTitle">Жалпы ұпай кестесі</h2>
  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Команда</th>
          <th>I</th><th>II</th><th>III</th><th>IV</th><th>V</th>
          <th>Барлығы</th>
        </tr>
      </thead>
      <tbody id="resultsBody"></tbody>
    </table>
  </div>
  <button class="ghost" id="closeResults">Жабу</button>
</dialog>

<script>
const TASKS=[
  {
    subject:"Математика",
    title:"Сандарды өсу ретімен орналастыр",
    items:["0,25","0,5","0,75","1"],
    explanation:"0,25 < 0,5 < 0,75 < 1."
  },
  {
    subject:"Алгебра",
    title:"Теңдеуді шешу қадамдарын ретте",
    items:["2x + 4 = 12","2x = 12 − 4","2x = 8","x = 4"],
    explanation:"Алдымен 4-ті азайтамыз, содан кейін 2-ге бөлеміз."
  },
  {
    subject:"Геометрия",
    title:"Тіктөртбұрыш периметрін есептеу жоспарын ретте",
    items:[
      "Ұзындығы мен енін анықтау",
      "Ұзындығы мен енін қосу",
      "Қосындыны 2-ге көбейту",
      "Нәтижені ұзындық бірлігімен жазу"
    ],
    explanation:"Тіктөртбұрыштың периметрі: P = 2(a + b)."
  },
  {
    subject:"Қазақ тілі",
    title:"Берілген әріптерді қазақ әліпбиінің ретімен орналастыр",
    items:["А","Ә","Б","В"],
    explanation:"Қазақ кирилл әліпбиінде берілген әріптердің реті: А, Ә, Б, В."
  },
  {
    subject:"Қазақ әдебиеті",
    title:"Оқиға желісінің берілген бөліктерін ретте",
    items:["Басталуы","Дамуы","Шарықтау шегі","Шешімі"],
    explanation:"Бұл — оқиға желісінің берілген бөліктерінің реті."
  },
  {
    subject:"Орыс тілі",
    title:"Расположите языковые единицы от меньшей к большей",
    items:["Звук","Слог","Слово","Предложение"],
    explanation:"Звуки образуют слоги, слоги входят в слова, слова — в предложения."
  },
  {
    subject:"Орыс әдебиеті",
    title:"Восстановите последовательность развития сюжета",
    items:["Начало","Развитие событий","Кульминация","Развязка"],
    explanation:"Сначала события начинаются и развиваются, затем достигают кульминации и завершаются развязкой."
  },
  {
    subject:"Ағылшын тілі",
    title:"Уақыт атауларын өткеннен болашаққа қарай ретте",
    items:["Yesterday","Today","Tomorrow","The day after tomorrow"],
    explanation:"Кеше → бүгін → ертең → бүрсігүні."
  },
  {
    subject:"Қазақстан тарихы",
    title:"Ғасырларды ертеден кейінгіге қарай орналастыр",
    items:["I ғасыр","V ғасыр","X ғасыр","XV ғасыр"],
    explanation:"I — 1, V — 5, X — 10, XV — 15."
  },
  {
    subject:"Дүниежүзі тарихы",
    title:"Берілген тарихи кезеңдерді ретімен орналастыр",
    items:["Ежелгі дүние","Орта ғасырлар","Жаңа заман","Қазіргі заман"],
    explanation:"Кезеңдер ертеден кейінгі уақытқа қарай берілген."
  },
  {
    subject:"География",
    title:"Жер қабаттарын ортасынан сыртына қарай ретте",
    items:["Ішкі ядро","Сыртқы ядро","Мантия","Жер қыртысы"],
    explanation:"Жердің ортасынан сыртқа қарай осы қабаттар орналасады."
  },
  {
    subject:"Биология",
    title:"Тұқымнан өсетін өсімдіктің даму кезеңдерін ретте",
    items:["Тұқым","Өскін","Жас өсімдік","Ересек өсімдік"],
    explanation:"Тұқым өніп, өскіннен жас өсімдік, кейін ересек өсімдік дамиды."
  },
  {
    subject:"Физика",
    title:"Ұзындық бірліктерін кішіден үлкенге қарай ретте",
    items:["Миллиметр","Сантиметр","Метр","Километр"],
    explanation:"1 см = 10 мм. 1 м = 100 см. 1 км = 1000 м."
  },
  {
    subject:"Химия",
    title:"Судың қыздыру кезіндегі күйлерін ретте",
    items:["Мұз","Сұйық су","Су буы"],
    explanation:"Мұз еріп сұйық суға, ал сұйық су буланып су буына айналады."
  },
  {
    subject:"Информатика",
    title:"Есепті бағдарламамен шешу жоспарын ретте",
    items:[
      "Есептің шартын түсіну",
      "Алгоритм құру",
      "Бағдарламаны жазу",
      "Нәтижені тексеру"
    ],
    explanation:"Алдымен есепті түсініп, шешу алгоритмін дайындаймыз."
  },
  {
    subject:"Музыка",
    title:"Ноталарды До нотасынан жоғары қарай ретте",
    items:["До","Ре","Ми","Фа"],
    explanation:"Берілген ноталардың жоғарылау реті: До, Ре, Ми, Фа."
  },
  {
    subject:"Көркем еңбек",
    title:"Кемпірқосақтағы берілген түстерді қызылдан көкке қарай ретте",
    items:["Қызыл","Сары","Жасыл","Көк"],
    explanation:"Кемпірқосақта осы төрт түс берілген ретпен орналасады. Араларында басқа реңктер де бар."
  },
  {
    subject:"Дене шынықтыру",
    title:"Жаттығудың берілген кезеңдерін қисынды ретке келтір",
    items:[
      "Денені қыздыру",
      "Негізгі жаттығулар",
      "Жүктемені біртіндеп азайту",
      "Қалпына келу"
    ],
    explanation:"Жаттығуға дайындалып, негізгі бөлімнен кейін жүктемені біртіндеп азайтамыз."
  },
  {
    subject:"Жаратылыстану · Ортақ жарыс",
    title:"Су айналымын буланудан бастап ретте",
    items:["Булану","Конденсация","Жауын-шашын","Судың жиналуы"],
    explanation:"Су айналымы қайталанып отырады. Бұл тізбек буланудан басталды."
  },
  {
    subject:"Логика · Ортақ жарыс",
    title:"Әр келесі саны екі есе артатын қатарды 3-тен бастап құрастыр",
    items:["3","6","12","24"],
    explanation:"3 × 2 = 6, 6 × 2 = 12, 12 × 2 = 24."
  }
];

const $=id=>document.getElementById(id);
const NAMES=["ИМПУЛЬС","КВАНТ","НОВА"];
const COLORS=["#ffd474","#72e5ff","#d6a1ff"];
const KEY="oi-baigesi-full-round4-v1";
const LEDGER_KEY="oi-baigesi-full-results-v1";

function shuffleIndices(length){
  let result;
  do{
    result=Array.from({length},(_,i)=>i);
    for(let i=length-1;i>0;i--){
      const j=Math.floor(Math.random()*(i+1));
      [result[i],result[j]]=[result[j],result[i]];
    }
  }while(result.every((value,index)=>value===index));
  return result;
}

function fresh(){
  return {
    index:0,
    completed:false,
    records:TASKS.map((task,index)=>({
      owner:index<18?index%3:null,
      order:shuffleIndices(task.items.length),
      sequence:[],
      remaining:20,
      started:false,
      closed:false,
      points:0,
      outcome:null
    }))
  };
}

let state=fresh();

try{
  const saved=JSON.parse(localStorage.getItem(KEY));

  if(
    saved&&Number.isInteger(saved.index)&&
    saved.index>=0&&saved.index<20&&
    typeof saved.completed==="boolean"&&
    Array.isArray(saved.records)&&saved.records.length===20&&
    saved.records.every((r,index)=>{
      const length=TASKS[index].items.length;
      return r&&
        (r.owner===null||[0,1,2].includes(r.owner))&&
        Array.isArray(r.order)&&r.order.length===length&&
        new Set(r.order).size===length&&
        r.order.every(n=>Number.isInteger(n)&&n>=0&&n<length)&&
        Array.isArray(r.sequence)&&r.sequence.length<=length&&
        new Set(r.sequence).size===r.sequence.length&&
        r.sequence.every(n=>Number.isInteger(n)&&n>=0&&n<length)&&
        Number.isFinite(r.remaining)&&r.remaining>=0&&r.remaining<=20&&
        typeof r.started==="boolean"&&typeof r.closed==="boolean"&&
        Number.isInteger(r.points)&&r.points>=0&&r.points<=10&&
        [null,"correct","wrong","timeout","skipped"].includes(r.outcome);
    })
  )state=saved;
}catch(error){}

let clock=null;
let deadline=0;
let soundEnabled=false;
let audioContext;
let lastBeep=-1;

const current=()=>state.records[state.index];
const pointsFor=s=>Math.min(10,Math.max(0,Math.ceil(s/2)));

function message(text,success=false){
  $("banner").textContent=text;
  $("banner").classList.toggle("success",success);
}

function score4(team){
  return state.records.reduce(
    (sum,r)=>sum+(r.owner===team&&r.closed?r.points:0),0
  );
}

function readLedger(){
  try{
    const data=JSON.parse(localStorage.getItem(LEDGER_KEY));
    if(data&&data.version===1&&data.rounds&&
      typeof data.rounds==="object"&&!Array.isArray(data.rounds)){
      return data;
    }
  }catch(error){}
  return {version:1,rounds:{}};
}

function allScores(){
  const data=readLedger();
  const scores=[];

  for(let round=1;round<=5;round++){
    const row=data.rounds["round"+round]?.scores;

    scores.push(
      Array.isArray(row)&&row.length===3&&
      row.every(n=>Number.isFinite(n)&&n>=0)
        ?row:[0,0,0]
    );
  }

  scores[3]=NAMES.map((name,team)=>score4(team));
  return scores;
}

function save(){
  try{
    localStorage.setItem(KEY,JSON.stringify(state));
    const data=readLedger();

    data.rounds.round4={
      scores:NAMES.map((name,team)=>score4(team)),
      completed:state.completed
    };

    localStorage.setItem(LEDGER_KEY,JSON.stringify(data));
  }catch(error){
    $("warning").hidden=false;
    $("warning").textContent=
      "Браузер сақтауды шектеді. Бетті жаппай, ұпайларды жазып алыңыз.";
  }
}

function stopClock(){
  clearInterval(clock);
  clock=null;
}

function snapshot(){
  if(clock){
    current().remaining=Math.max(
      0,(deadline-performance.now())/1000
    );
  }
}

function tone(frequency,duration=.2,delay=0){
  if(!soundEnabled||!audioContext||
    audioContext.state!=="running"||document.hidden)return;

  const now=audioContext.currentTime+delay;
  const oscillator=audioContext.createOscillator();
  const gain=audioContext.createGain();

  oscillator.frequency.value=frequency;
  gain.gain.setValueAtTime(0,now);
  gain.gain.linearRampToValueAtTime(.035,now+.02);
  gain.gain.exponentialRampToValueAtTime(.0001,now+duration);

  oscillator.connect(gain);
  gain.connect(audioContext.destination);
  oscillator.start(now);
  oscillator.stop(now+duration+.04);

  oscillator.onended=()=>{
    oscillator.disconnect();
    gain.disconnect();
  };
}

function updateScores(){
  const scores=allScores();

  for(let team=0;team<3;team++){
    $("details"+team).textContent=
      `I: ${scores[0][team]} · II: ${scores[1][team]} · `+
      `III: ${scores[2][team]} · IV: ${scores[3][team]}`;

    $("total"+team).textContent=
      "Барлығы: "+scores.reduce((sum,row)=>sum+row[team],0);

    $("team"+team).classList.toggle(
      "active",!state.completed&&current().owner===team
    );
  }
}

function paintTimer(){
  const r=current();
  $("seconds").textContent=Math.ceil(r.remaining);
  $("possible").textContent=
    (r.closed?r.points:pointsFor(r.remaining))+" ұпай";
}

function renderOrder(){
  const r=current();
  const task=TASKS[state.index];
  const length=task.items.length;
  const playable=Boolean(clock)&&r.owner!==null&&!r.closed&&!state.completed;
  const visible=r.started||r.closed;

  $("timeline").style.gridTemplateColumns=`repeat(${length},1fr)`;
  $("choices").style.gridTemplateColumns=`repeat(${length},1fr)`;

  $("timeline").replaceChildren();
  $("choices").replaceChildren();

  for(let position=0;position<length;position++){
    const slot=document.createElement("div");
    slot.className="slot";

    const label=document.createElement("small");
    label.textContent=(position+1)+"-ОРЫН";

    const text=document.createElement("span");

    if(position<r.sequence.length){
      text.textContent=task.items[r.sequence[position]];
      slot.classList.add("filled");
      if(r.outcome==="correct")slot.classList.add("correct");
    }else{
      text.textContent="…";
    }

    slot.append(label,text);
    $("timeline").appendChild(slot);
  }

  if(!visible)return;

  r.order.forEach(index=>{
    const button=document.createElement("button");
    button.className="choice";
    button.textContent=task.items[index];

    const used=r.sequence.includes(index);
    button.classList.toggle("used",used);
    button.disabled=!playable||used;

    button.onclick=()=>{
      if(!clock||r.closed||r.owner===null||r.sequence.includes(index))return;

      snapshot();

      if(r.remaining<=0){
        finish("timeout",0);
        return;
      }

      r.sequence.push(index);
      save();
      renderOrder();
      controls();
      tone(440+r.sequence.length*90,.12);
    };

    $("choices").appendChild(button);
  });
}

function controls(){
  const r=current();
  const blocked=r.closed||state.completed;
  const playable=Boolean(clock)&&r.owner!==null&&!blocked;

  $("start").hidden=blocked;
  $("pause").hidden=blocked;
  $("back").hidden=blocked;
  $("clear").hidden=blocked;
  $("check").hidden=blocked;
  $("skip").hidden=blocked;
  $("next").hidden=!r.closed||state.completed;

  $("start").disabled=Boolean(clock);
  $("start").textContent=r.started
    ?"▶ Уақытты жалғастыру":"▶ Тапсырманы ашу";

  $("pause").disabled=!clock;
  $("back").disabled=!playable||r.sequence.length===0;
  $("clear").disabled=!playable||r.sequence.length===0;
  $("check").disabled=!playable||
    r.sequence.length!==TASKS[state.index].items.length;

  $("next").textContent=state.index===19
    ?"IV турды аяқтау →":"Келесі тапсырма →";

  $("claim").hidden=blocked||state.index<18||r.owner!==null;

  document.querySelectorAll("[data-team]").forEach(button=>{
    button.disabled=!clock||r.owner!==null||blocked;
  });

  paintTimer();
}

function showProof(){
  const r=current();
  $("proof").hidden=!r.closed||state.completed;
  if(!r.closed)return;

  $("proof").replaceChildren();

  const title=document.createElement("strong");
  title.textContent="Дұрыс рет:";

  const sequence=document.createElement("div");
  sequence.textContent=TASKS[state.index].items.join(" → ");

  const explanation=document.createElement("div");
  explanation.textContent=TASKS[state.index].explanation;

  $("proof").append(title,sequence,explanation);
}

function show(){
  stopClock();

  const r=current();
  const task=TASKS[state.index];

  $("subject").textContent=state.completed
    ?"IV ТУР ҚОРЫТЫНДЫСЫ":task.subject;

  $("title").textContent=state.completed
    ?"Тамаша! Төртінші тур аяқталды!"
    :task.title;

  $("counter").textContent=state.completed
    ?"20 тапсырма аяқталды"
    :`Тапсырма ${state.index+1} / 20`;

  $("turn").textContent=state.completed
    ?"IV ТУР АЯҚТАЛДЫ"
    :r.owner===null
      ?"ОРТАҚ ЖАРЫС"
      :"Кезек: "+NAMES[r.owner];

  $("turn").style.color=r.owner===null?"#ffda88":COLORS[r.owner];
  $("turn").style.borderColor=r.owner===null?"#ffda88":COLORS[r.owner];

  $("progress").replaceChildren();

  state.records.forEach((record,index)=>{
    const dot=document.createElement("span");
    dot.className="progress-dot";
    if(record.closed)dot.classList.add("done");
    if(index===state.index&&!state.completed)dot.classList.add("current");
    $("progress").appendChild(dot);
  });

  $("help").textContent=state.completed
    ?"Нәтижелер жалпы ұпай кестесінде сақталды."
    :state.index>=18&&r.owner===null
      ?"Тапсырма ашылғаннан кейін бірінші белгі берген топты жүргізуші таңдайды."
      :"Аралас бөліктерді дұрыс ретімен басыңыз. Соңында «Ретін тексеру» басыңыз.";

  renderOrder();
  controls();
  showProof();
  updateScores();

  message(state.completed
    ?"IV тур аяқталды. Ұпай кестесін ашуға болады."
    :r.closed
      ?"Тапсырма аяқталды. Келесіге өтіңіз."
      :r.started
        ?"Тапсырма сақталған. Уақытты жалғастыра аласыз."
        :"Топ өкілі дайындалсын. Тапсырманы оқып, бөліктерді ашыңыз."
  );
}

function tick(){
  snapshot();
  paintTimer();

  const seconds=Math.ceil(current().remaining);

  if(seconds>0&&seconds<=5&&seconds!==lastBeep){
    tone(700,.1);
  }

  lastBeep=seconds;

  if(current().remaining<=0)finish("timeout",0);
}

function startTimer(){
  const r=current();

  if(state.completed||r.closed||clock)return;

  if(r.remaining<=0){
    finish("timeout",0);
    return;
  }

  r.started=true;
  deadline=performance.now()+r.remaining*1000;
  lastBeep=-1;
  clock=setInterval(tick,100);

  save();
  renderOrder();
  controls();

  message(r.owner===null
    ?"Ортақ жарыс! Бірінші белгі берген топты жүргізуші таңдасын."
    :NAMES[r.owner]+": бөліктерді дұрыс ретімен басыңыз!"
  );
}

function finish(outcome,points){
  const r=current();
  if(r.closed||state.completed)return;

  stopClock();
  r.closed=true;
  r.outcome=outcome;
  r.points=points;

  save();
  show();

  if(outcome==="correct"){
    const praise=[
      "Уақыт тізбегін қалпына келтірдіңдер!",
      "Керемет реттілік!",
      "Жарайсыңдар!",
      "Логикаларың мықты!"
    ];

    message(
      praise[Math.floor(Math.random()*praise.length)]+" "+
      NAMES[r.owner]+" командасына +"+points+" ұпай!",
      true
    );

    [523,659,784].forEach((f,i)=>tone(f,.5,i*.13));
  }else{
    message(outcome==="timeout"
      ?"Уақыт аяқталды. Дұрыс рет төменде көрсетілген."
      :outcome==="skipped"
        ?"Тапсырма өткізілді. Ұпай қосылмады."
        :"Ретте қате бар. Дұрыс тізбекпен салыстырыңыз. Ұпай қосылмады."
    );
    tone(260,.25);
  }
}

$("start").onclick=startTimer;

$("pause").onclick=()=>{
  if(!clock)return;

  snapshot();
  stopClock();

  if(current().remaining<=0){
    finish("timeout",0);
    return;
  }

  save();
  renderOrder();
  controls();
  message("Уақыт кідіртілді.");
};

$("back").onclick=()=>{
  const r=current();
  if(!clock||r.closed||r.owner===null||!r.sequence.length)return;

  snapshot();
  if(r.remaining<=0){
    finish("timeout",0);
    return;
  }

  r.sequence.pop();
  save();
  renderOrder();
  controls();
};

$("clear").onclick=()=>{
  const r=current();
  if(!clock||r.closed||r.owner===null)return;

  snapshot();
  if(r.remaining<=0){
    finish("timeout",0);
    return;
  }

  r.sequence=[];
  save();
  renderOrder();
  controls();
};

$("check").onclick=()=>{
  const r=current();

  if(!clock||r.closed||r.owner===null||
    r.sequence.length!==TASKS[state.index].items.length)return;

  snapshot();

  if(r.remaining<=0){
    finish("timeout",0);
    return;
  }

  const correct=r.sequence.every((value,index)=>value===index);

  finish(
    correct?"correct":"wrong",
    correct?pointsFor(r.remaining):0
  );
};

document.querySelectorAll("[data-team]").forEach(button=>{
  button.onclick=()=>{
    const r=current();
    if(!clock||r.closed||r.owner!==null||state.index<18)return;

    snapshot();

    if(r.remaining<=0){
      finish("timeout",0);
      return;
    }

    r.owner=Number(button.dataset.team);
    save();
    renderOrder();
    controls();
    updateScores();

    $("turn").textContent="Жауап береді: "+NAMES[r.owner];
    $("turn").style.color=COLORS[r.owner];

    message(NAMES[r.owner]+": дұрыс тізбекті құрастырыңыз!");
  };
});

$("skip").onclick=()=>{
  if(current().closed||state.completed)return;

  snapshot();
  stopClock();
  renderOrder();
  controls();

  if(!confirm("Тапсырманы ұпай бермей өткіземіз бе?")){
    save();
    message("Уақыт кідіртілді. Жалғастыруға болады.");
    return;
  }

  finish("skipped",0);
};

$("next").onclick=()=>{
  if(!current().closed||state.completed)return;

  if(state.index===19){
    state.completed=true;
    save();
    show();
    openResults();
    return;
  }

  state.index++;
  save();
  show();

  if(state.index%5===0){
    message("ӨКІЛДЕРДІ АУЫСТЫРЫҢЫЗДАР! Әр топтан келесі оқушы шықсын.");
  }
};

function openResults(){
  if(clock){
    snapshot();
    stopClock();
    save();
    renderOrder();
    controls();
  }

  const scores=allScores();

  $("resultsTitle").textContent=state.completed
    ?"IV турдың қорытындысы":"Жалпы ұпай кестесі";

  $("resultsBody").replaceChildren();

  NAMES.forEach((name,team)=>{
    const row=document.createElement("tr");

    [
      name,...scores.map(s=>s[team]),
      scores.reduce((sum,s)=>sum+s[team],0)
    ].forEach(value=>{
      const cell=document.createElement("td");
      cell.textContent=value;
      row.appendChild(cell);
    });

    $("resultsBody").appendChild(row);
  });

  $("resultsDialog").showModal();
}

$("results").onclick=openResults;
$("closeResults").onclick=()=>$("resultsDialog").close();

$("reset").onclick=()=>{
  if(!confirm("Тек IV турдың барлық нәтижесін тазалаймыз ба?"))return;

  stopClock();
  state=fresh();
  save();
  show();
};

$("sound").onclick=async()=>{
  soundEnabled=!soundEnabled;

  $("sound").textContent="♫ "+(soundEnabled?"Қосулы":"Өшірулі");
  $("sound").setAttribute("aria-pressed",String(soundEnabled));

  if(!soundEnabled)return;

  try{
    const Audio=window.AudioContext||window.webkitAudioContext;
    if(!Audio)return;
    if(!audioContext)audioContext=new Audio();
    await audioContext.resume();
    tone(660,.3);
  }catch(error){}
};

$("fullscreen").onclick=async()=>{
  try{
    if(document.fullscreenElement)await document.exitFullscreen();
    else await document.documentElement.requestFullscreen();
  }catch(error){
    message("Толық экранды браузер мәзірінен қосыңыз.");
  }
};

document.addEventListener("visibilitychange",()=>{
  if(!document.hidden||!clock)return;

  snapshot();
  stopClock();
  save();
  renderOrder();
  controls();

  message("Бет жасырылғандықтан уақыт кідіртілді.");
});

window.addEventListener("pagehide",()=>{
  snapshot();
  stopClock();
  save();
});

show();
</script>

     color:#40250b;font-weight:800;text-decoration:none;"
     onclick="return confirm('IV тур аяқталды ма? Алтын финалға өтеміз бе?');">
    V тур — Алтын финал 🏆 →
  </a>
